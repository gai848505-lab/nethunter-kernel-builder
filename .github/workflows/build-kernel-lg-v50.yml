name: Build NetHunter Kernel - LG V50 ThinQ (flashlmdd)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kernel-lg-v50.yml'
      - 'configs/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev libssl-dev libncurses5-dev libelf-dev xz-utils

      - name: Download Toolchains (Proton Clang & AOSP GCC)
        run: |
          mkdir -p toolchain
          cd toolchain
          echo "Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "Cloning AOSP GCC aarch64 & arm32..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          cd ..

      - name: Fetch LG V50 Kernel Source (LineageOS 21 / SM8150)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_lge_sm8150.git -b lineage-21 kernel
          cd kernel

          # Allow warnings and ignored optimization arguments without failing build
          echo "KBUILD_CFLAGS += -Wno-error -Wno-ignored-optimization-argument -Wno-unknown-warning-option -Wno-implicit-function-declaration" >> arch/arm64/Makefile

          # Clone RTL8812AU wireless injection driver
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl8812au || true
          cd ..

      - name: Configure with Exact Running Defconfig & NetHunter Features
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc64/bin:${GITHUB_WORKSPACE}/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          mkdir -p out
          
          # Use the exact running defconfig extracted from the phone
          cp ../configs/flashlmdd_lineage21_defconfig out/.config

          # Enable Kali NetHunter wireless & penetration testing features
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-openela-perf+" \
            --enable CONFIG_CFG80211 \
            --enable CONFIG_CFG80211_WEXT \
            --enable CONFIG_MAC80211 \
            --enable CONFIG_MAC80211_RC_MINSTREL \
            --enable CONFIG_MAC80211_RC_MINSTREL_HT \
            --enable CONFIG_MAC80211_LEDS \
            --module CONFIG_ATH9K_HTC \
            --module CONFIG_RTL8187 \
            --module CONFIG_RT2X00 \
            --module CONFIG_RT2800USB \
            --module CONFIG_RTL8192CU \
            --module CONFIG_RTL8XXXU \
            --module CONFIG_MT7601U \
            --enable CONFIG_USB_CONFIGFS_F_HID \
            --enable CONFIG_USB_F_HID \
            --enable CONFIG_NAMESPACES \
            --enable CONFIG_UTS_NS \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_PID_NS \
            --enable CONFIG_NET_NS

          make O=out CC=clang olddefconfig
          cd ..

      - name: Compile Kernel (Clang + LLVM)
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc64/bin:${GITHUB_WORKSPACE}/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            Image.gz dtbs
          cd ..

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=boot;/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' anykernel.sh
          # Remove sample patching of non-existent tuna files
          sed -i '/fstab\.tuna/d' anykernel.sh
          sed -i '/init\.tuna/d' anykernel.sh
          sed -i '/init\.rc/d' anykernel.sh
          
          if [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
          fi

          ZIPNAME="NetHunter-Kernel-LG-V50-Lineage21-$(date +%Y%m%d_%H%M%S).zip"
          zip -r9 "$ZIPNAME" * -x .git README.md *placeholder
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          cd ..

      - name: Upload Kernel Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: anykernel/${{ env.ZIPNAME }}
