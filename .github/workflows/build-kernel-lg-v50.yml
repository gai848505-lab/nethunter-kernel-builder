name: Build NetHunter Kernel - LG V50 ThinQ (flashlmdd)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kernel-lg-v50.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev libssl-dev libncurses5-dev libelf-dev xz-utils

      - name: Download Toolchains (Proton Clang & AOSP GCC)
        run: |
          mkdir -p toolchain
          cd toolchain
          echo "Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "Cloning AOSP GCC aarch64 & arm32..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          cd ..

      - name: Fetch LG V50 Kernel Source (SM8150 / 4.14)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_lge_sm8150.git -b lineage-20 kernel
          cd kernel
          
          # Patch header syntax in lge_prm.h
          find . -name "lge_prm.h" -exec sed -i 's/{return 0}/{return 0;}/g' {} +
          find . -name "lge_prm.h" -exec sed -i 's/void lge_prm_display_set_event(.*) {return 0};/void lge_prm_display_set_event(enum display_event event, int value) { return; };/g' {} +

          # Patch board_lge.h header declarations using echo
          echo "#ifndef _LGE_EXTRA_TYPES_H" >> include/soc/qcom/lge/board_lge.h
          echo "#define _LGE_EXTRA_TYPES_H" >> include/soc/qcom/lge/board_lge.h
          echo "#include <linux/types.h>" >> include/soc/qcom/lge/board_lge.h
          echo "#ifndef LGE_BOOT_MODE_CHARGERLOGO" >> include/soc/qcom/lge/board_lge.h
          echo "#define LGE_BOOT_MODE_CHARGERLOGO 1" >> include/soc/qcom/lge/board_lge.h
          echo "#endif" >> include/soc/qcom/lge/board_lge.h
          echo "#ifndef LT_CABLE_56K" >> include/soc/qcom/lge/board_lge.h
          echo "typedef int cable_boot_type;" >> include/soc/qcom/lge/board_lge.h
          echo "#define LT_CABLE_56K 1" >> include/soc/qcom/lge/board_lge.h
          echo "#define LT_CABLE_130K 2" >> include/soc/qcom/lge/board_lge.h
          echo "#define LT_CABLE_910K 3" >> include/soc/qcom/lge/board_lge.h
          echo "#endif" >> include/soc/qcom/lge/board_lge.h
          echo "extern int lge_get_boot_mode(void);" >> include/soc/qcom/lge/board_lge.h
          echo "extern int lge_get_factory_boot(void);" >> include/soc/qcom/lge/board_lge.h
          echo "extern int lge_get_mfts_mode(void);" >> include/soc/qcom/lge/board_lge.h
          echo "extern bool lge_get_download_mode(void);" >> include/soc/qcom/lge/board_lge.h
          echo "extern cable_boot_type lge_get_boot_cable(void);" >> include/soc/qcom/lge/board_lge.h
          echo "#endif" >> include/soc/qcom/lge/board_lge.h

          # Include board_lge.h in callers
          sed -i '1s/^/#include <linux\/types.h>\n#include <soc\/qcom\/lge\/board_lge.h>\n/' fs/proc/cmdline.c techpack/audio/asoc/codecs/es9218p.c drivers/gpu/drm/msm/lge/lge_dsi_panel.c drivers/power/reset/msm-poweroff.c || true

          # Patch FG_LGE definition if missing
          sed -i '1s/^/#ifndef FG_LGE\n#define FG_LGE BIT(16)\n#endif\n/' drivers/power/supply/qcom/qpnp-fg-gen4.c || true

          # Patch qpnp-qnovo5.c pinctrl fields
          sed -i 's/struct qnovo {/struct qnovo {\n\tstruct pinctrl *pinctrl;\n\tstruct pinctrl_state *pinctrl_state1;\n\tstruct pinctrl_state *pinctrl_state2;/g' drivers/power/supply/qcom/qpnp-qnovo5.c || true

          # Provide weak stubs in board_lge.c for linker safety
          if [ -f "drivers/soc/qcom/lge/board_lge.c" ]; then
            echo "int __attribute__((weak)) lge_get_boot_mode(void) { return 0; }" >> drivers/soc/qcom/lge/board_lge.c
            echo "int __attribute__((weak)) lge_get_factory_boot(void) { return 0; }" >> drivers/soc/qcom/lge/board_lge.c
            echo "int __attribute__((weak)) lge_get_mfts_mode(void) { return 0; }" >> drivers/soc/qcom/lge/board_lge.c
            echo "bool __attribute__((weak)) lge_get_download_mode(void) { return false; }" >> drivers/soc/qcom/lge/board_lge.c
            echo "cable_boot_type __attribute__((weak)) lge_get_boot_cable(void) { return 0; }" >> drivers/soc/qcom/lge/board_lge.c
          fi

          # Patch UFS driver health descriptor function declaration and stub
          sed -i '1s/^/struct ufs_hba;\nint ufshcd_read_health_desc(struct ufs_hba *hba, u8 *desc_buf, int size);\n/' drivers/scsi/ufs/ufshcd.c || true
          echo "int __attribute__((weak)) ufshcd_read_health_desc(struct ufs_hba *hba, u8 *desc_buf, int size) { return 0; }" >> drivers/scsi/ufs/ufshcd.c

          # Allow warnings without failing build
          echo "KBUILD_CFLAGS += -Wno-error=implicit-function-declaration -Wno-error" >> arch/arm64/Makefile

          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl8812au || true
          cd ..

      - name: Configure and Merge Defconfig
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc64/bin:${GITHUB_WORKSPACE}/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          mkdir -p out
          
          CONFIG_FRAG=""
          if [ -f "arch/arm64/configs/vendor/flashlmdd.config" ]; then
            CONFIG_FRAG="arch/arm64/configs/vendor/flashlmdd.config"
          elif [ -f "arch/arm64/configs/vendor/alphaplus.config" ]; then
            CONFIG_FRAG="arch/arm64/configs/vendor/alphaplus.config"
          fi

          echo "Merging configs with merge_config.sh..."
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/vendor/sm8150-perf_defconfig $CONFIG_FRAG

          # Enable Kali NetHunter features
          ./scripts/config --file out/.config \
            --enable CONFIG_MACH_LGE \
            --enable CONFIG_CFG80211 \
            --enable CONFIG_CFG80211_WEXT \
            --enable CONFIG_MAC80211 \
            --enable CONFIG_MAC80211_RC_MINSTREL \
            --enable CONFIG_MAC80211_RC_MINSTREL_HT \
            --enable CONFIG_MAC80211_LEDS \
            --module CONFIG_ATH9K_HTC \
            --module CONFIG_RTL8187 \
            --module CONFIG_RT2X00 \
            --module CONFIG_RT2800USB \
            --module CONFIG_RTL8192CU \
            --module CONFIG_RTL8XXXU \
            --module CONFIG_MT7601U \
            --enable CONFIG_USB_CONFIGFS_F_HID \
            --enable CONFIG_USB_F_HID \
            --enable CONFIG_NAMESPACES \
            --enable CONFIG_UTS_NS \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_PID_NS \
            --enable CONFIG_NET_NS \
            --disable CONFIG_QPNP_QNOVO5

          make O=out CC=clang olddefconfig
          cd ..

      - name: Compile Kernel (Clang + LLVM)
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc64/bin:${GITHUB_WORKSPACE}/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            Image.gz dtbs
          cd ..

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=auto/block=\/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          
          if [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
          fi

          ZIPNAME="NetHunter-Kernel-LG-V50-$(date +%Y%m%d_%H%M%S).zip"
          zip -r9 "$ZIPNAME" * -x .git README.md *placeholder
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          cd ..

      - name: Upload Kernel Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: anykernel/${{ env.ZIPNAME }}
