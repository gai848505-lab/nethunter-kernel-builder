name: Build NetHunter Kernel - Asus Zenfone Max Pro M1 (X00TD)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kernel-asus-x00td.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev libssl-dev libncurses5-dev libelf-dev xz-utils

      - name: Download Toolchains (Proton Clang & AOSP GCC)
        run: |
          mkdir -p toolchain
          cd toolchain
          echo "Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "Cloning AOSP GCC aarch64 & arm32..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          cd ..

      - name: Fetch Asus X00TD Kernel Source (SDM660 / 4.4 Pie)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_asus_sdm660.git -b lineage-16.0 kernel || \
          git clone --depth=1 https://github.com/tattwamashi/android_kernel_asus_sdm660-LTO.git -b pie kernel || \
          git clone --depth=1 https://github.com/LineageOS/android_kernel_asus_sdm660.git -b lineage-18.1 kernel
          cd kernel
          
          # Ensure ASUS SDM660 flags are defined and disable failing warnings
          echo "KBUILD_CFLAGS += -DCONFIG_MACH_ASUS_SDM660=1 -Wno-error" >> Makefile

          # Ensure mac80211 60GHz compatibility in 4.4 kernel
          sed -i 's/case IEEE80211_BAND_60GHZ://g' net/mac80211/*.c || true
          sed -i 's/IEEE80211_BAND_60GHZ/4/g' net/mac80211/*.c || true
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl8812au || true
          cd ..

      - name: Configure with Exact Running Stock Pie Defconfig & NetHunter Features
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc64/bin:${GITHUB_WORKSPACE}/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          mkdir -p out

          # Use exact running stock pie defconfig extracted directly from the phone
          if [ -f "../configs/asus_x00td_stock_pie_defconfig" ]; then
            cp ../configs/asus_x00td_stock_pie_defconfig out/.config
          else
            make O=out CC=clang X00TD_defconfig
          fi

          # Enable Kali NetHunter wireless & penetration testing features
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-perf+" \
            --enable CONFIG_MACH_ASUS_SDM660 \
            --enable CONFIG_MACH_ASUS_X00TD \
            --enable CONFIG_CFG80211 \
            --enable CONFIG_CFG80211_WEXT \
            --enable CONFIG_MAC80211 \
            --enable CONFIG_MAC80211_RC_MINSTREL \
            --enable CONFIG_MAC80211_RC_MINSTREL_HT \
            --enable CONFIG_MAC80211_LEDS \
            --enable CONFIG_NET_RADIO \
            --module CONFIG_ATH9K_HTC \
            --enable CONFIG_ATH9K_HTC_DEBUGFS \
            --module CONFIG_RTL8187 \
            --module CONFIG_RT2X00 \
            --module CONFIG_RT2800USB \
            --enable CONFIG_RT2800USB_RT33XX \
            --enable CONFIG_RT2800USB_RT35XX \
            --enable CONFIG_RT2800USB_RT53XX \
            --enable CONFIG_RT2800USB_UNKNOWN \
            --module CONFIG_RTL8192CU \
            --module CONFIG_RTL8XXXU \
            --module CONFIG_MT7601U \
            --enable CONFIG_USB_CONFIGFS_F_HID \
            --enable CONFIG_USB_F_HID \
            --enable CONFIG_SYSVIPC \
            --enable CONFIG_POSIX_MQUEUE \
            --enable CONFIG_NAMESPACES \
            --enable CONFIG_UTS_NS \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_PID_NS \
            --enable CONFIG_NET_NS

          make O=out CC=clang olddefconfig
          cd ..

      - name: Compile Kernel (Clang + LLVM)
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc64/bin:${GITHUB_WORKSPACE}/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            Image.gz-dtb Image.gz dtbs

          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
          fi
          cd ..

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=1/IS_SLOT_DEVICE=0/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=X00TD/g' anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=Kali NetHunter Kernel for Asus X00TD Pie/g' anykernel.sh
          
          # Remove Galaxy Nexus sample patches from anykernel.sh
          sed -i '/init.rc/,/write_boot/ { /backup_file/d; /replace_string/d; /insert_line/d; /append_file/d; /patch_fstab/d; }' anykernel.sh
          
          if [ -f "../kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          elif [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
          else
            echo "ERROR: Kernel binary Image not found!"
            exit 1
          fi

          ZIPNAME="NetHunter-Kernel-Asus-X00TD-Pie-$(date +%Y%m%d_%H%M%S).zip"
          zip -r9 "$ZIPNAME" * -x .git README.md *placeholder
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          cd ..

      - name: Upload Kernel Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: anykernel/${{ env.ZIPNAME }}
